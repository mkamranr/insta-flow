name: instaflow

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # Only public entrypoint. Bound to IPv4 loopback explicitly: Tailscale
      # Funnel proxies to 127.0.0.1, and a bare "8080:8080" binds the IPv6
      # wildcard, which lets an unrelated IPv4-loopback service on the same
      # port silently win the funnel. Not exposed on the LAN.
      - "127.0.0.1:${HOST_PORT:-8090}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: [.env]
    expose: ["8000"]
    volumes:
      - ./scripts:/app/scripts:ro
      # Attachments live on the host so they survive a rebuild. Meta fetches
      # them from /files/... on the public URL.
      - ./uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    env_file: [.env]
    volumes:
      # The same uploads directory the API mounts. `refresh_geoip_database` runs
      # HERE, on the Wed/Sat cron, and writes to /app/uploads/.geoip -- without
      # this mount it wrote into the worker's own layer, where the API could
      # never read it and a restart discarded it. Attachments are read here too
      # when a rule sends a file.
      - ./uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # ARQ has no HTTP surface; a live worker holds a Redis health key.
      test: ["CMD", "python", "-c", "import redis,os,sys; r=redis.Redis.from_url(os.environ['REDIS_URL']); sys.exit(0 if r.ping() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose: ["3000"]

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    expose: ["27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  redis_data:
  caddy_data:
  caddy_config:
