# Production: one EC2 instance, images pulled from ECR rather than built.
#
# Differences from docker-compose.yml, and only these:
#   - pulls images instead of building them (a t3.small builds the frontend slowly)
#   - Caddy publishes 80 and 443 to the world instead of binding 127.0.0.1
#   - Caddy gets a real hostname and obtains its own certificate
#   - MongoDB requires authentication
#
#   docker compose -f docker-compose.prod.yml up -d
#
# `docker compose` with no -f still runs the local file, so working on the Mac
# is unchanged.

name: socialflow

x-app-image: &app-image
  image: ${ECR_REGISTRY:?set ECR_REGISTRY in .env}/${ECR_REPO:?set ECR_REPO in .env}:${API_TAG:-api}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # Public. 80 is required as well as 443: Let's Encrypt uses it for the
      # HTTP-01 challenge, and Caddy redirects it to HTTPS afterwards.
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # Holds the ACME account key and certificates once Caddy owns TLS. Losing
      # this repeatedly will hit Let's Encrypt rate limits, so never prune it.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Substituted into the Caddyfile, so the domain lives in .env with
      # everything else rather than being edited into a config file.
      - SITE_DOMAIN=${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

  api:
    <<: *app-image
    restart: unless-stopped
    env_file: [.env]
    expose: ["8000"]
    volumes:
      # Attachments Meta fetches by URL, and the GeoLite2 database. On the host
      # disk so a container replacement does not lose them.
      - ./uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    # The same image as `api`. Only the command differs.
    <<: *app-image
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    env_file: [.env]
    volumes:
      # Required: the GeoIP refresh cron runs in the worker and writes here.
      - ./uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,os,sys; r=redis.Redis.from_url(os.environ['REDIS_URL']); sys.exit(0 if r.ping() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ${ECR_REGISTRY:?set ECR_REGISTRY in .env}/${ECR_REPO:?set ECR_REPO in .env}:${WEB_TAG:-web}
    restart: unless-stopped
    expose: ["3000"]

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    # Authentication, unlike the local file. Credentials are applied only to a
    # FRESH data volume -- setting them after first boot does nothing, so they
    # must be in .env before the first `up`.
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:?set MONGO_USER in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongodb_data:/data/db
    expose: ["27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  redis_data:
  caddy_data:
  caddy_config:
